# P-Layer Journal Radar — journal configuration
# Each entry maps a journal to its Crossref ISSN, optional publisher RSS URL,
# and the subfield/tier it belongs to in the P-Layer Journal Library.
#
# Fields
#   id          short, lowercase, used as the RSS feed filename: docs/{id}.xml
#   abbr        common abbreviation shown in UI
#   name        full English title
#   subfield    one of: marketing | management | ob | psychology | sociology
#               | anthropology | economics | communication | is | education
#   tier        1 (top flagship) or 2 (next-tier / field journal)
#   issn        primary print or electronic ISSN registered with Crossref
#               (Crossref accepts either; we just need one valid one)
#   publisher   publisher name (purely informational; not used for fetching)
#   stage       where the journal's latest articles appear (informational)
#   publisher_rss  optional direct RSS URL from the publisher; used as a
#                 fallback when Crossref returns < MIN_ARTICLES articles.
#                 Leave empty to use Crossref only.
#   enabled     true | false — disable a journal without deleting the entry
#   note        optional, free-form notes (e.g. "shared ISSN with X")

